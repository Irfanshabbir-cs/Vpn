name: vpn_app
description: "Production-grade VPN client (Flutter, Riverpod, GoRouter, Clean Architecture)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_messaging: ^15.0.1
  firebase_analytics: ^11.2.0
  firebase_crashlytics: ^4.0.1

  # Auth providers
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Biometrics
  local_auth: ^2.2.0

  # UI / UX
  cupertino_icons: ^1.0.6
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  fl_chart: ^0.68.0
  smooth_page_indicator: ^1.2.0
  country_flags: ^3.0.0

  # Maps (interactive world map)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0

  # In-app purchases
  in_app_purchase: ^3.2.0
  wireguard_flutter: ^0.1.3
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/flags/
